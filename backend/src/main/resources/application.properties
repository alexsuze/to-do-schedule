spring.application.name=to-do-schedule-backend

# Railway 會注入 PORT 環境變數
server.port=${PORT:8080}

# MongoDB Atlas 連線字串
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/todo_schedule}
spring.mongodb.database=${MONGODB_DATABASE:todo_schedule}

# 前後端共用的簡易存取 Token
app.api-token=${API_TOKEN:dev-token}

# 允許的前端來源（多個以逗號分隔）
app.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Resend
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# 前端網址（Email 內連結使用）
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Actuator：只公開 health
management.endpoints.web.exposure.include=health

# JSON 欄位名稱與 Mongo 一致（snake_case）
spring.jackson.property-naming-strategy=SNAKE_CASE
# 啟動時依 @CompoundIndex 建立索引
spring.data.mongodb.auto-index-creation=true
# 錯誤回應帶 message，前端直接顯示
server.error.include-message=always
